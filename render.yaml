services:
  - type: web
    name: radio-pop-gospel
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: POP_GOSPEL_PANEL_TOKEN
        sync: false
      - key: PUBLIC_RADIO_NAME
        value: Radio Pop Gospel
      - key: PARTNER_NAME
        value: Web Rádio Vem Comigo Deus
