services:
  - type: web
    name: radio-pop-gospel
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: radio-pop-gospel-data
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: DATA_DIR
        value: /var/data
      - key: PUBLIC_RADIO_NAME
        value: Radio Pop Gospel
      - key: PARTNER_NAME
        value: Web Rádio Vem Comigo Deus
